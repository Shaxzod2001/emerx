<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X5 Abet — Контроль обеденных перерывов</title>
  <meta name="description" content="Система контроля обеденных перерывов сотрудников">
  <link rel="icon" type="image/png" href="/icons/icon-96.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f9c4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X5 Abet">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ========== ANIMATSIYALI FON ========== -->
  <canvas id="bg-canvas"></canvas>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <a class="logo" onclick="showPage('dashboard')" style="cursor:pointer">
      <div class="logo-icon"><img src="/icons/icon-192.png" alt="X5 Abet" class="logo-icon-img"></div>
      <span class="logo-text"><span class="logo-x5">X5</span> <span class="logo-accent">Abet</span></span>
    </a>

    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="tj">TJ</button>
    </div>

    <div class="nav-links" id="nav-links">
      <!-- Guest -->
      <div id="nav-auth" style="display:flex;gap:8px;align-items:center">
        <button class="nav-btn nav-btn-ghost" id="nav-login">Войти</button>
        <button class="nav-btn nav-btn-primary" id="nav-register">Регистрация</button>
      </div>

      <!-- User -->
      <div id="nav-user" style="display:none;gap:8px;align-items:center">
        <button class="nav-btn nav-btn-ghost" id="nav-dashboard">🍽️ Обед</button>
        <button class="nav-btn nav-btn-ghost" id="nav-chat">💬 Чат</button>
        <button class="nav-btn nav-btn-ghost" id="nav-announcements">📢 Новости</button>
        <button class="nav-btn nav-btn-ghost" id="nav-admin" style="display:none;color:#f59e0b">⚙️ Админ</button>
        <button class="nav-bell" id="nav-bell" title="Уведомления">
          🔔<span class="bell-dot" id="bell-dot" style="display:none"></span>
        </button>
        <button class="nav-profile-btn" id="nav-profile" title="Профиль">
          <span id="nav-username" class="nav-username"></span>
        </button>
        <button class="nav-btn nav-btn-ghost" id="nav-logout" style="color:var(--red)">Выйти</button>
      </div>
    </div>

    <!-- Mobil: qo'ng'iroqcha doim ko'rinib turadi (menyu ochilmasa ham) -->
    <button class="nav-bell nav-bell-mobile" id="nav-bell-mobile" title="Уведомления">
      🔔<span class="bell-dot" id="bell-dot-mobile" style="display:none"></span>
    </button>

    <!-- Hamburger -->
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Mobile menu overlay -->
  <div class="mobile-overlay" id="mobile-overlay" onclick="closeMobileMenu()"></div>

  <!-- ========== PAGES ========== -->
  <div class="page active" id="page-dashboard"></div>
  <div class="page" id="page-auth" data-tab="login"></div>
  <div class="page" id="page-profile"></div>
  <div class="page" id="page-admin"></div>
  <div class="page" id="page-announcements"></div>
  <div class="page" id="page-chat"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/bg.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
