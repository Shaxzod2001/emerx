<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmerX — Kiberxavfsizlik Akademiyasi</title>
  <meta name="description" content="EmerX — Kiberxavfsizlikni noldan senior darajagacha o'rganing">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ========== ANIMATSIYALI FON ========== -->
  <canvas id="bg-canvas"></canvas>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <a class="logo" onclick="showPage('home')" style="cursor:pointer">
      <div class="logo-icon">🛡️</div>
      <span class="logo-text">EmerX</span>
    </a>

    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <div class="nav-links" id="nav-links">
      <button class="nav-btn nav-btn-ghost" id="nav-home">🏠 Bosh sahifa</button>
      <button class="nav-btn nav-btn-ghost" id="nav-courses">📚 Kurslar</button>
      <button class="nav-btn nav-btn-ghost" id="nav-leaderboard">🏆 Reyting</button>
      <button class="nav-btn nav-btn-ghost" id="nav-support">💬 Yordam</button>

      <!-- Guest -->
      <div id="nav-auth" style="display:flex;gap:8px;align-items:center">
        <button class="nav-btn nav-btn-ghost" id="nav-login">Kirish</button>
        <button class="nav-btn nav-btn-primary" id="nav-register">Ro'yxat</button>
      </div>

      <!-- User -->
      <div id="nav-user" style="display:none;gap:8px;align-items:center">
        <button class="nav-btn nav-btn-ghost" id="nav-dashboard">📊 Dashboard</button>
        <div class="nav-coins" id="nav-coins-wrap">
          <span class="coin-icon">🪙</span>
          <span id="nav-coins">0</span>
        </div>
        <button class="nav-profile-btn" id="nav-profile" title="Profil">
          <img id="nav-avatar" src="" alt="" style="display:none;width:32px;height:32px;border-radius:50%;object-fit:cover;">
          <span id="nav-username" class="nav-username"></span>
        </button>
        <button class="nav-btn nav-btn-ghost" id="nav-logout" style="color:var(--red)">Chiqish</button>
      </div>
    </div>

    <!-- Hamburger -->
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Mobile menu overlay -->
  <div class="mobile-overlay" id="mobile-overlay" onclick="closeMobileMenu()"></div>

  <!-- ========== PAGES ========== -->
  <div class="page active" id="page-home"></div>
  <div class="page" id="page-courses"></div>
  <div class="page" id="page-lesson"></div>
  <div class="page" id="page-dashboard"></div>
  <div class="page" id="page-auth" data-tab="login"></div>
  <div class="page" id="page-leaderboard"></div>
  <div class="page" id="page-support"></div>
  <div class="page" id="page-profile"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>
  <!-- COIN ANIMATION -->
  <div class="coin-popup" id="coin-popup"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/bg.js"></script>
</body>
</html>
