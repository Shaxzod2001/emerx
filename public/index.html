<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmerX — Abet Nazorati</title>
  <meta name="description" content="Xodimlarning abetga (tushlik tanaffusiga) chiqish vaqtini nazorat qilish tizimi">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕐</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00ff88">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EmerX">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ========== ANIMATSIYALI FON ========== -->
  <canvas id="bg-canvas"></canvas>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <a class="logo" onclick="showPage('dashboard')" style="cursor:pointer">
      <div class="logo-icon">🕐</div>
      <span class="logo-text">EmerX Abet</span>
    </a>

    <div class="nav-links" id="nav-links">
      <!-- Guest -->
      <div id="nav-auth" style="display:flex;gap:8px;align-items:center">
        <button class="nav-btn nav-btn-ghost" id="nav-login">Kirish</button>
        <button class="nav-btn nav-btn-primary" id="nav-register">Ro'yxat</button>
      </div>

      <!-- User -->
      <div id="nav-user" style="display:none;gap:8px;align-items:center">
        <button class="nav-btn nav-btn-ghost" id="nav-dashboard">🍽️ Abet</button>
        <button class="nav-btn nav-btn-ghost" id="nav-admin" style="display:none;color:#f59e0b">⚙️ Admin</button>
        <button class="nav-profile-btn" id="nav-profile" title="Profil">
          <span id="nav-username" class="nav-username"></span>
        </button>
        <button class="nav-btn nav-btn-ghost" id="nav-logout" style="color:var(--red)">Chiqish</button>
      </div>
    </div>

    <!-- Hamburger -->
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Mobile menu overlay -->
  <div class="mobile-overlay" id="mobile-overlay" onclick="closeMobileMenu()"></div>

  <!-- ========== PAGES ========== -->
  <div class="page active" id="page-dashboard"></div>
  <div class="page" id="page-auth" data-tab="login"></div>
  <div class="page" id="page-profile"></div>
  <div class="page" id="page-admin"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/bg.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
